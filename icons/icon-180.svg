<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- マスク：角丸の形状 -->
    <mask id="roundedMask">
      <rect width="180" height="180" rx="40" fill="white"/>
    </mask>
  </defs>
  
  <!-- 全体をマスクで切り抜き -->
  <g mask="url(#roundedMask)">
    <!-- 背景 -->
    <rect width="180" height="180" fill="#1a1a2e"/>
    
    <!-- ネオングロー効果 -->
    <circle cx="90" cy="90" r="65" fill="none" stroke="#00d4ff" stroke-width="8" opacity="0.1"/>
    <circle cx="90" cy="90" r="65" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.15"/>
    <circle cx="90" cy="90" r="65" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.2"/>
    <circle cx="90" cy="90" r="65" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.25"/>
    
    <circle cx="90" cy="90" r="50" fill="none" stroke="#00d4ff" stroke-width="12" opacity="0.15"/>
    <circle cx="90" cy="90" r="50" fill="none" stroke="#00d4ff" stroke-width="8" opacity="0.25"/>
    <circle cx="90" cy="90" r="50" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.4"/>
    <circle cx="90" cy="90" r="50" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
    
    <circle cx="90" cy="90" r="30" fill="none" stroke="#00ff88" stroke-width="8" opacity="0.1" stroke-dasharray="8,4"/>
    <circle cx="90" cy="90" r="30" fill="none" stroke="#00ff88" stroke-width="5" opacity="0.2" stroke-dasharray="8,4"/>
    <circle cx="90" cy="90" r="30" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.4" stroke-dasharray="8,4"/>
    <circle cx="90" cy="90" r="30" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.8" stroke-dasharray="8,4"/>
    
    <circle cx="90" cy="90" r="6" fill="#00ff88" opacity="0.2"/>
    <circle cx="90" cy="90" r="4" fill="#00ff88" opacity="0.5"/>
    <circle cx="90" cy="90" r="3" fill="#00ff88"/>
    
    <circle cx="140" cy="90" r="5" fill="#00d4ff" opacity="0.2"/>
    <circle cx="140" cy="90" r="3" fill="#00d4ff" opacity="0.5"/>
    <circle cx="140" cy="90" r="2" fill="#00d4ff" opacity="0.9"/>
    
    <circle cx="90" cy="40" r="5" fill="#00ff88" opacity="0.15"/>
    <circle cx="90" cy="40" r="3" fill="#00ff88" opacity="0.4"/>
    <circle cx="90" cy="40" r="2" fill="#00ff88" opacity="0.7"/>
    
    <circle cx="40" cy="90" r="5" fill="#00d4ff" opacity="0.15"/>
    <circle cx="40" cy="90" r="3" fill="#00d4ff" opacity="0.4"/>
    <circle cx="40" cy="90" r="2" fill="#00d4ff" opacity="0.8"/>
  </g>
</svg>