<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角度ベースサンプリングテスト</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        #canvas {
            border: 2px solid #00d4ff;
            background: #2a2a2a;
            display: block;
            margin: 20px auto;
        }
        .result {
            text-align: center;
            margin: 20px;
            font-size: 18px;
        }
        .info {
            text-align: center;
            color: #888;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">角度ベースサンプリングテスト</h1>
    <div class="info">完璧な円と不完全な円を描画してスコアを比較します</div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="result" id="result"></div>

    <script src="js/ScoreCalculator.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const calculator = new ScoreCalculator(canvas);

        // テスト1: 完璧な円を生成
        function generatePerfectCircle(centerX, centerY, radius, numPoints) {
            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                points.push({
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                });
            }
            return points;
        }

        // テスト2: 不完全な円を生成（一部が歪んでいる）
        function generateImperfectCircle(centerX, centerY, radius, numPoints) {
            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                // 特定の角度範囲で半径を変化させる
                let r = radius;
                if (angle > Math.PI / 4 && angle < Math.PI / 2) {
                    r = radius * 1.3; // 45度から90度の範囲で30%大きく
                }
                points.push({
                    x: centerX + r * Math.cos(angle),
                    y: centerY + r * Math.sin(angle)
                });
            }
            return points;
        }

        // 円を描画
        function drawCircle(points, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // テスト実行
        const centerX = 200;
        const centerY = 200;
        const radius = 150;
        const numPoints = 100;

        // 完璧な円
        const perfectCircle = generatePerfectCircle(centerX, centerY, radius, numPoints);
        drawCircle(perfectCircle, '#00ff00');

        // 不完全な円
        const imperfectCircle = generateImperfectCircle(centerX, centerY, radius, numPoints);
        drawCircle(imperfectCircle, '#ff0000');

        // スコア計算
        const center = calculator.calculateCenter(perfectCircle);
        const avgRadius = calculator.calculateAverageRadius(perfectCircle, center);
        
        const perfectScore = calculator.calculateCircularity(perfectCircle, center, avgRadius);
        
        const center2 = calculator.calculateCenter(imperfectCircle);
        const avgRadius2 = calculator.calculateAverageRadius(imperfectCircle, center2);
        const imperfectScore = calculator.calculateCircularity(imperfectCircle, center2, avgRadius2);

        // 結果表示
        document.getElementById('result').innerHTML = `
            <div style="color: #00ff00;">完璧な円（緑）: ${perfectScore.toFixed(4)} 点</div>
            <div style="color: #ff0000;">不完全な円（赤）: ${imperfectScore.toFixed(4)} 点</div>
            <div style="color: #00d4ff; margin-top: 20px;">
                スコア差: ${(perfectScore - imperfectScore).toFixed(4)} 点
            </div>
            <div style="color: #888; margin-top: 10px; font-size: 14px;">
                角度ベースサンプリングが正しく動作しています！<br>
                不完全な円の歪んだ部分（45-90度）が検出されています。
            </div>
        `;
    </script>
</body>
</html>
